<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="404 Not Found - Mendez Cleaning" />
<title>404 Not Found - Mendez</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B1B3A;
    --lime: #B2D52F;
    --white: #ffffff;
    --r: 22px;
  }
  body {
    font-family: "Mulish", system-ui, sans-serif;
    color: var(--ink);
    background: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 { font-family: "Baloo 2"; font-size: 4rem; margin-bottom: 10px; }
  p { font-size: 1.2rem; margin-bottom: 20px; }
  a {
    background: var(--lime);
    color: var(--ink);
    padding: 12px 24px;
    border-radius: var(--r);
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! The page you're looking for doesn't exist.</p>
  <a href="index.html">Return to Home</a>
</body>
</html>
